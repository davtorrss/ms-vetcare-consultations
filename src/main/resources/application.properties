spring.application.name=ms-vetcare-consultations

server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/consultations_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Microsoft Entra / JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/b5cc8e1d-1dbb-4b10-bbf5-da56c099e228/v2.0
vetcare.security.audience=75dfa48a-173a-4c90-8413-e6ac41efbc58

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always